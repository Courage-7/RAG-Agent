[project]
name = "rag-agent-workspace"
version = "0.1.0"
description = "Adaptive, evaluation-driven RAG and agent platform"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "ipykernel>=7,<8",
    "mypy>=1.18,<2",
    "nbclient>=0.10,<1",
    "nbformat>=5.10,<6",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.2,<2",
    "ruff>=0.13,<1",
]

[tool.uv]
package = false
required-version = ">=0.10.3,<0.13"

[tool.uv.workspace]
members = ["apps/api", "apps/worker", "packages/core"]

[tool.uv.sources]
rag-core = { workspace = true }

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
exclude = ["docs", "notebooks"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true

[tool.pyright]
include = ["apps", "packages", "tests", "evals"]
extraPaths = [
    "apps/api/src",
    "apps/worker/src",
    "packages/core/src",
]

