name: rag-agent

services:
  postgres-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis-broker:
    image: redis:8.2.9-alpine3.22
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-broker-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    command:
      [
        "uv",
        "run",
        "--frozen",
        "--package",
        "rag-api",
        "uvicorn",
        "rag_api.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      RAG_DATABASE_URL: ${RAG_DATABASE_URL:-postgresql://postgres:postgrespassword@postgres-db:5432/postgres}
      RAG_ENVIRONMENT: local
      RAG_JSON_LOGS: "true"
      RAG_REDIS_BROKER_URL: redis://redis-broker:6379/0
      RAG_SUPABASE_URL: ${RAG_SUPABASE_URL:-http://host.docker.internal:54321}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      redis-broker:
        condition: service_healthy
      postgres-db:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    command: ["uv", "run", "--frozen", "--package", "rag-worker", "dramatiq", "rag_worker.app"]
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      RAG_DATABASE_URL: ${RAG_DATABASE_URL:-postgresql://postgres:postgrespassword@postgres-db:5432/postgres}
      RAG_ENVIRONMENT: local
      RAG_JSON_LOGS: "true"
      RAG_REDIS_BROKER_URL: redis://redis-broker:6379/0
      RAG_SUPABASE_URL: ${RAG_SUPABASE_URL:-http://host.docker.internal:54321}
    depends_on:
      redis-broker:
        condition: service_healthy
      postgres-db:
        condition: service_healthy

  dispatcher:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    command:
      [
        "uv",
        "run",
        "--frozen",
        "--package",
        "rag-worker",
        "python",
        "-m",
        "rag_worker.dispatcher",
      ]
    environment:
      RAG_DATABASE_URL: ${RAG_DATABASE_URL:-postgresql://postgres:postgrespassword@postgres-db:5432/postgres}
      RAG_ENVIRONMENT: local
      RAG_JSON_LOGS: "true"
      RAG_REDIS_BROKER_URL: redis://redis-broker:6379/0
    depends_on:
      redis-broker:
        condition: service_healthy
      postgres-db:
        condition: service_healthy

volumes:
  redis-broker-data:
  postgres-data:
