[project]
name = "rag-core"
version = "0.1.0"
description = "Provider-neutral domain contracts for the RAG platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain-core>=1.2,<2",
    "langchain-groq>=1.1,<2",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.12,<3",
    "structlog>=25.5,<26",
]

[build-system]
requires = ["uv-build>=0.10.3,<0.13"]
build-backend = "uv_build"

