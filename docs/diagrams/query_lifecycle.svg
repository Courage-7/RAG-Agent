<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 760" role="img" lang="en" aria-labelledby="query-seq-title" data-quality-profile="showcase">
  <style>
    :root {
      --bg: #ffffff;
      --grid: #f1f5f9;
      --text: #0f172a;
      --text-muted: #334155;
      --text-dim: #475569;
      --text-faint: #64748b;
      --panel: #ffffff;
      --panel-border: #cbd5e1;
      --lane-fill: #f8fafc;
      --lane-stroke: #cbd5e1;
      --arrow: #334155;
      --arrow-emphasis: #059669;
      --mask: #ffffff;
      --frontend-fill: #f0f9ff;
      --frontend-stroke: #0284c7;
      --backend-fill: #ecfdf5;
      --backend-stroke: #059669;
      --database-fill: #f5f3ff;
      --database-stroke: #7c3aed;
      --cloud-fill: #fffbeb;
      --cloud-stroke: #b45309;
      --security-fill: #fff1f2;
      --security-stroke: #e11d48;
      --messagebus-fill: #fff7ed;
      --messagebus-stroke: #c2410c;
      --external-fill: #f8fafc;
      --external-stroke: #475569;
    }

    /* Base Elements */
    text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .c-bg { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
    .c-grid { stroke: #f1f5f9; fill: none; stroke-width: 1; }
    .c-mask { fill: #ffffff; stroke: none; }

    /* Node Fills &amp; High-Contrast Borders */
    .c-frontend { fill: #f0f9ff; stroke: #0284c7; stroke-width: 1.5; }
    .c-backend { fill: #ecfdf5; stroke: #059669; stroke-width: 1.5; }
    .c-database { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.5; }
    .c-cloud { fill: #fffbeb; stroke: #b45309; stroke-width: 1.5; }
    .c-security { fill: #fff1f2; stroke: #e11d48; stroke-width: 1.5; }
    .c-messagebus { fill: #fff7ed; stroke: #c2410c; stroke-width: 1.5; }
    .c-external { fill: #f8fafc; stroke: #475569; stroke-width: 1.5; }
    .c-region { fill: rgba(180, 83, 9, 0.04); stroke: #b45309; stroke-dasharray: 6,4; stroke-width: 1.5; }
    .c-security-group { fill: transparent; stroke: #e11d48; stroke-dasharray: 4,4; stroke-width: 1.5; }

    /* Crisp Arrows &amp; Connectors */
    .a-default { stroke: #334155; fill: none; stroke-width: 1.75; }
    .a-emphasis { stroke: #059669; fill: none; stroke-width: 2; }
    .a-security { stroke: #e11d48; fill: none; stroke-width: 1.75; }
    .a-dashed { stroke: #c2410c; fill: none; stroke-dasharray: 5,4; stroke-width: 1.75; }
    .m-default { fill: #334155; }
    .m-emphasis { fill: #059669; }
    .m-security { fill: #e11d48; }
    .m-dashed { fill: #c2410c; }

    /* High-Contrast Pitch-Dark Text */
    .t-primary { fill: #0f172a; font-weight: 600; }
    .t-muted { fill: #334155; font-weight: 500; }
    .t-dim { fill: #475569; }
    .t-backend { fill: #047857; font-weight: 600; }
    .t-cloud { fill: #b45309; font-weight: 600; }
    .t-security { fill: #be123c; font-weight: 600; }
    .t-database { fill: #6d28d9; font-weight: 600; }
    .t-messagebus { fill: #c2410c; font-weight: 600; }
  </style>
  <rect width="100%" height="100%" class="c-bg" rx="10" />

        <title id="query-seq-title">Query &amp; Adaptive Retrieval Lifecycle</title>
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-default" />
          </marker>
          <marker id="arrowhead-emphasis" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-emphasis" />
          </marker>
          <marker id="arrowhead-security" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-security" />
          </marker>
          <marker id="arrowhead-dashed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-dashed" />
          </marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" class="c-grid" stroke-width="0.5"/>
          </pattern>
        </defs>

        <rect width="100%" height="100%" fill="url(#grid)" />

        <!-- Phase Segments -->
        <rect data-graph-role="structural-frame" data-composition-frame-kind="segment" x="30" y="145" width="880" height="165" rx="8" class="c-lane" stroke-width="1"/>
        <g><rect x="42" y="126" width="250" height="18" rx="3" class="c-mask"/><text x="48" y="139" class="t-dim" font-size="9" font-weight="600">Phase 1: SSE Request &amp; Query Condensation</text></g>

        <rect data-graph-role="structural-frame" data-composition-frame-kind="segment" x="30" y="330" width="880" height="215" rx="8" class="c-lane" stroke-width="1"/>
        <g><rect x="42" y="311" width="270" height="18" rx="3" class="c-mask"/><text x="48" y="324" class="t-dim" font-size="9" font-weight="600">Phase 2: Hybrid Search &amp; Cross-Encoder Rescoring</text></g>

        <rect data-graph-role="structural-frame" data-composition-frame-kind="segment" x="30" y="560" width="880" height="155" rx="8" class="c-lane" stroke-width="1"/>
        <g><rect x="42" y="541" width="250" height="18" rx="3" class="c-mask"/><text x="48" y="554" class="t-dim" font-size="9" font-weight="600">Phase 3: Grounded Synthesis &amp; Token Streaming</text></g>

        <!-- Lifelines -->
        <path d="M 65 125 L 65 710" class="a-default" stroke-width="0.8" stroke-dasharray="3,7"/>
        <path d="M 195 125 L 195 710" class="a-default" stroke-width="0.8" stroke-dasharray="3,7"/>
        <path d="M 325 125 L 325 710" class="a-default" stroke-width="0.8" stroke-dasharray="3,7"/>
        <path d="M 455 125 L 455 710" class="a-default" stroke-width="0.8" stroke-dasharray="3,7"/>
        <path d="M 585 125 L 585 710" class="a-default" stroke-width="0.8" stroke-dasharray="3,7"/>
        <path d="M 715 125 L 715 710" class="a-default" stroke-width="0.8" stroke-dasharray="3,7"/>
        <path d="M 845 125 L 845 710" class="a-default" stroke-width="0.8" stroke-dasharray="3,7"/>

        <!-- Activation Bars -->
        <rect class="activation-bar c-mask" data-participant="api" x="190" y="174" width="10" height="518" rx="3"/>
        <rect class="activation-bar c-backend" data-participant="api" x="190" y="174" width="10" height="518" rx="3" stroke-width="1"/>

        <rect class="activation-bar c-mask" data-participant="agent" x="320" y="210" width="10" height="412" rx="3"/>
        <rect class="activation-bar c-backend" data-participant="agent" x="320" y="210" width="10" height="412" rx="3" stroke-width="1"/>

        <rect class="activation-bar c-mask" data-participant="groq" x="840" y="244" width="10" height="46" rx="3"/>
        <rect class="activation-bar c-cloud" data-participant="groq" x="840" y="244" width="10" height="46" rx="3" stroke-width="1"/>

        <rect class="activation-bar c-mask" data-participant="postgres" x="450" y="344" width="10" height="46" rx="3"/>
        <rect class="activation-bar c-database" data-participant="postgres" x="450" y="344" width="10" height="46" rx="3" stroke-width="1"/>

        <rect class="activation-bar c-mask" data-participant="reranker" x="580" y="420" width="10" height="46" rx="3"/>
        <rect class="activation-bar c-backend" data-participant="reranker" x="580" y="420" width="10" height="46" rx="3" stroke-width="1"/>

        <rect class="activation-bar c-mask" data-participant="groq" x="840" y="570" width="10" height="50" rx="3"/>
        <rect class="activation-bar c-cloud" data-participant="groq" x="840" y="570" width="10" height="50" rx="3" stroke-width="1"/>

        <!-- Messages -->
        <!-- m1: client -> api -->
        <g data-edge-id="m1" data-edge-from="client" data-edge-to="api">
          <path d="M 70 178 L 190 178" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
          <rect x="80" y="160" width="100" height="15" rx="3" class="c-mask"/>
          <text x="130" y="171" class="t-backend" font-size="8" text-anchor="middle">POST /stream</text>
        </g>

        <!-- m2: api -> agent -->
        <g data-edge-id="m2" data-edge-from="api" data-edge-to="agent">
          <path d="M 200 215 L 320 215" class="a-default" stroke-width="1.5" marker-end="url(#arrowhead)"/>
          <rect x="210" y="197" width="100" height="15" rx="3" class="c-mask"/>
          <text x="260" y="208" class="t-muted" font-size="8" text-anchor="middle">invoke StateGraph</text>
        </g>

        <!-- m3: agent -> groq -->
        <g data-edge-id="m3" data-edge-from="agent" data-edge-to="groq">
          <path d="M 330 250 L 840 250" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
          <rect x="520" y="233" width="130" height="15" rx="3" class="c-mask"/>
          <text x="585" y="244" class="t-backend" font-size="8" text-anchor="middle">condense: pronoun rewrite</text>
        </g>

        <!-- m4: groq -> agent -->
        <g data-edge-id="m4" data-edge-from="groq" data-edge-to="agent">
          <path d="M 840 285 L 330 285" class="a-return" stroke-width="1.4" marker-end="url(#arrowhead)"/>
          <rect x="510" y="268" width="150" height="15" rx="3" class="c-mask"/>
          <text x="585" y="279" class="t-muted" font-size="8" text-anchor="middle">standalone search query</text>
        </g>

        <!-- m5: agent -> postgres -->
        <g data-edge-id="m5" data-edge-from="agent" data-edge-to="postgres">
          <path d="M 330 350 L 450 350" class="a-default" stroke-width="1.5" marker-end="url(#arrowhead)"/>
          <rect x="340" y="333" width="100" height="15" rx="3" class="c-mask"/>
          <text x="390" y="344" class="t-muted" font-size="8" text-anchor="middle">match_chunks_hybrid</text>
        </g>

        <!-- m6: postgres -> agent -->
        <g data-edge-id="m6" data-edge-from="postgres" data-edge-to="agent">
          <path d="M 450 385 L 330 385" class="a-return" stroke-width="1.4" marker-end="url(#arrowhead)"/>
          <rect x="340" y="368" width="100" height="15" rx="3" class="c-mask"/>
          <text x="390" y="379" class="t-muted" font-size="8" text-anchor="middle">top-20 fused (RRF k=60)</text>
        </g>

        <!-- m7: agent -> reranker -->
        <g data-edge-id="m7" data-edge-from="agent" data-edge-to="reranker">
          <path d="M 330 425 L 580 425" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
          <rect x="400" y="408" width="110" height="15" rx="3" class="c-mask"/>
          <text x="455" y="419" class="t-backend" font-size="8" text-anchor="middle">joint cross-attention</text>
        </g>

        <!-- m8: reranker -> agent -->
        <g data-edge-id="m8" data-edge-from="reranker" data-edge-to="agent">
          <path d="M 580 460 L 330 460" class="a-return" stroke-width="1.4" marker-end="url(#arrowhead)"/>
          <rect x="395" y="443" width="120" height="15" rx="3" class="c-mask"/>
          <text x="455" y="454" class="t-muted" font-size="8" text-anchor="middle">top-5 rescored passages</text>
        </g>

        <!-- m9: agent -> web -->
        <g data-edge-id="m9" data-edge-from="agent" data-edge-to="web">
          <path d="M 330 495 L 710 495" class="a-security" stroke-width="1.5" marker-end="url(#arrowhead-security)"/>
          <rect x="460" y="478" width="120" height="15" rx="3" class="c-mask"/>
          <text x="520" y="489" class="t-security" font-size="8" text-anchor="middle">[CRAG fallback if 0 chunks]</text>
        </g>

        <!-- m10: web -> agent -->
        <g data-edge-id="m10" data-edge-from="web" data-edge-to="agent">
          <path d="M 710 525 L 330 525" class="a-return" stroke-width="1.4" marker-end="url(#arrowhead)"/>
          <rect x="465" y="508" width="110" height="15" rx="3" class="c-mask"/>
          <text x="520" y="519" class="t-muted" font-size="8" text-anchor="middle">live web search snippets</text>
        </g>

        <!-- m11: agent -> groq -->
        <g data-edge-id="m11" data-edge-from="agent" data-edge-to="groq">
          <path d="M 330 575 L 840 575" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
          <rect x="520" y="558" width="130" height="15" rx="3" class="c-mask"/>
          <text x="585" y="569" class="t-backend" font-size="8" text-anchor="middle">stream synthesis prompt</text>
        </g>

        <!-- m12: groq -> api -->
        <g data-edge-id="m12" data-edge-from="groq" data-edge-to="api">
          <path d="M 840 615 L 200 615" class="a-return" stroke-width="1.4" marker-end="url(#arrowhead)"/>
          <rect x="470" y="598" width="100" height="15" rx="3" class="c-mask"/>
          <text x="520" y="609" class="t-muted" font-size="8" text-anchor="middle">SSE token packets</text>
        </g>

        <!-- m13: api -> client -->
        <g data-edge-id="m13" data-edge-from="api" data-edge-to="client">
          <path d="M 190 650 L 70 650" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
          <rect x="80" y="633" width="100" height="15" rx="3" class="c-mask"/>
          <text x="130" y="644" class="t-backend" font-size="8" text-anchor="middle">token stream [1], [2]</text>
        </g>

        <!-- m14: api -> client -->
        <g data-edge-id="m14" data-edge-from="api" data-edge-to="client">
          <path d="M 190 685 L 70 685" class="a-return" stroke-width="1.4" marker-end="url(#arrowhead)"/>
          <rect x="85" y="668" width="90" height="15" rx="3" class="c-mask"/>
          <text x="130" y="679" class="t-muted" font-size="8" text-anchor="middle">event: done {citations}</text>
        </g>

        <!-- Participants -->
        <g data-node-id="client">
          <rect x="20" y="65" width="90" height="54" rx="6" class="c-mask"/>
          <rect x="20" y="65" width="90" height="54" rx="6" class="c-external" stroke-width="1.5"/>
          <text x="65" y="87" class="t-primary" font-size="10.5" font-weight="600" text-anchor="middle">Client UI</text>
          <text x="65" y="103" class="t-muted" font-size="7.5" text-anchor="middle">Browser / REST</text>
        </g>

        <g data-node-id="api">
          <rect x="150" y="65" width="90" height="54" rx="6" class="c-mask"/>
          <rect x="150" y="65" width="90" height="54" rx="6" class="c-backend" stroke-width="1.5"/>
          <text x="195" y="87" class="t-primary" font-size="10.5" font-weight="600" text-anchor="middle">FastAPI</text>
          <text x="195" y="103" class="t-muted" font-size="7.5" text-anchor="middle">Stream Handler</text>
        </g>

        <g data-node-id="agent">
          <rect x="280" y="65" width="90" height="54" rx="6" class="c-mask"/>
          <rect x="280" y="65" width="90" height="54" rx="6" class="c-backend" stroke-width="1.5"/>
          <text x="325" y="87" class="t-primary" font-size="10.5" font-weight="600" text-anchor="middle">LangGraph</text>
          <text x="325" y="103" class="t-muted" font-size="7.5" text-anchor="middle">StateGraph Core</text>
        </g>

        <g data-node-id="postgres">
          <rect x="410" y="65" width="90" height="54" rx="6" class="c-mask"/>
          <rect x="410" y="65" width="90" height="54" rx="6" class="c-database" stroke-width="1.5"/>
          <text x="455" y="87" class="t-primary" font-size="10.5" font-weight="600" text-anchor="middle">PostgreSQL</text>
          <text x="455" y="103" class="t-muted" font-size="7.5" text-anchor="middle">HNSW + BM25</text>
        </g>

        <g data-node-id="reranker">
          <rect x="540" y="65" width="90" height="54" rx="6" class="c-mask"/>
          <rect x="540" y="65" width="90" height="54" rx="6" class="c-backend" stroke-width="1.5"/>
          <text x="585" y="87" class="t-primary" font-size="10.5" font-weight="600" text-anchor="middle">FlashRank</text>
          <text x="585" y="103" class="t-muted" font-size="7.5" text-anchor="middle">Cross-Encoder</text>
        </g>

        <g data-node-id="web">
          <rect x="670" y="65" width="90" height="54" rx="6" class="c-mask"/>
          <rect x="670" y="65" width="90" height="54" rx="6" class="c-cloud" stroke-width="1.5"/>
          <text x="715" y="87" class="t-primary" font-size="10.5" font-weight="600" text-anchor="middle">Web Search</text>
          <text x="715" y="103" class="t-muted" font-size="7.5" text-anchor="middle">CRAG Fallback</text>
        </g>

        <g data-node-id="groq">
          <rect x="800" y="65" width="90" height="54" rx="6" class="c-mask"/>
          <rect x="800" y="65" width="90" height="54" rx="6" class="c-cloud" stroke-width="1.5"/>
          <text x="845" y="87" class="t-primary" font-size="10.5" font-weight="600" text-anchor="middle">Groq LPU</text>
          <text x="845" y="103" class="t-muted" font-size="7.5" text-anchor="middle">Llama-3.3-70b</text>
        </g>
      </svg>