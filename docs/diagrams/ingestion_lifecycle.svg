<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 740" role="img" lang="en" aria-labelledby="ingestion-seq-title" data-quality-profile="showcase">
    <style>
  <![CDATA[
    :root {
      --bg: #ffffff;
      --text: #0f172a;
      --text-muted: #334155;
      --text-dim: #475569;
      --border: #cbd5e1;
      --lane-bg: #f8fafc;
      --lane-stroke: #cbd5e1;
      --arrow: #334155;
      --arrow-emphasis: #059669;
      --mask: #ffffff;
    }

    /* Typography */
    text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      text-rendering: geometricPrecision;
    }

    /* Backgrounds and Frames */
    .c-bg { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
    .c-grid { stroke: #f1f5f9; fill: none; stroke-width: 1; }
    .c-mask { fill: #ffffff !important; stroke: #cbd5e1 !important; stroke-width: 1; }
    .c-lane { fill: #f8fafc !important; stroke: #cbd5e1 !important; stroke-width: 1.5; }
    .node-box { stroke-width: 1.5; }

    /* Node Category Fills and Crisp Borders */
    .c-frontend { fill: #f0f9ff !important; stroke: #0284c7 !important; stroke-width: 1.5; }
    .c-backend { fill: #ecfdf5 !important; stroke: #059669 !important; stroke-width: 1.5; }
    .c-database { fill: #f5f3ff !important; stroke: #7c3aed !important; stroke-width: 1.5; }
    .c-cloud { fill: #fffbeb !important; stroke: #b45309 !important; stroke-width: 1.5; }
    .c-security { fill: #fff1f2 !important; stroke: #e11d48 !important; stroke-width: 1.5; }
    .c-messagebus { fill: #fff7ed !important; stroke: #c2410c !important; stroke-width: 1.5; }
    .c-external { fill: #f8fafc !important; stroke: #475569 !important; stroke-width: 1.5; }
    .c-region { fill: rgba(180, 83, 9, 0.04) !important; stroke: #b45309 !important; stroke-dasharray: 6,4; stroke-width: 1.5; }
    .c-security-group { fill: transparent !important; stroke: #e11d48 !important; stroke-dasharray: 4,4; stroke-width: 1.5; }

    /* Connectors and Arrows */
    .a-default { stroke: #334155 !important; fill: none; stroke-width: 1.75; }
    .a-emphasis { stroke: #059669 !important; fill: none; stroke-width: 2; }
    .a-security { stroke: #e11d48 !important; fill: none; stroke-width: 1.75; }
    .a-dashed { stroke: #c2410c !important; fill: none; stroke-dasharray: 5,4; stroke-width: 1.75; }
    .a-return { stroke: #475569 !important; fill: none; stroke-dasharray: 5,5; stroke-width: 1.5; }
    .m-default { fill: #334155 !important; }
    .m-emphasis { fill: #059669 !important; }
    .m-security { fill: #e11d48 !important; }
    .m-dashed { fill: #c2410c !important; }

    /* Activation Bars in Sequence Diagrams */
    .activation-bar { stroke-width: 1; }

    /* High-Contrast Pitch-Dark Text */
    .t-primary { fill: #0f172a !important; font-weight: 600; }
    .t-muted { fill: #334155 !important; font-weight: 500; }
    .t-dim { fill: #334155 !important; font-weight: 600; }
    .t-backend { fill: #047857 !important; font-weight: 600; }
    .t-cloud { fill: #b45309 !important; font-weight: 600; }
    .t-security { fill: #be123c !important; font-weight: 600; }
    .t-database { fill: #6d28d9 !important; font-weight: 600; }
    .t-messagebus { fill: #c2410c !important; font-weight: 600; }
  ]]>
  </style>
  <rect width="100%" height="100%" class="c-bg" rx="10" />

        <title id="ingestion-seq-title">Document Ingestion Lifecycle</title>
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-default" />
          </marker>
          <marker id="arrowhead-emphasis" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-emphasis" />
          </marker>
          <marker id="arrowhead-security" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-security" />
          </marker>
          <marker id="arrowhead-dashed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-dashed" />
          </marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" class="c-grid" stroke-width="0.5"/>
          </pattern>
        </defs>

        <rect width="100%" height="100%" fill="url(#grid)" />

        <!-- Phase Segments -->
        <rect data-graph-role="structural-frame" data-composition-frame-kind="segment" x="30" y="145" width="860" height="155" rx="8" class="c-lane" stroke-width="1"/>
        <g><rect x="42" y="126" width="235" height="18" rx="3" class="c-mask"/><text x="48" y="139" class="t-dim" font-size="13" font-weight="600">Phase 1: Atomic Intake &amp; Outbox Commit</text></g>

        <rect data-graph-role="structural-frame" data-composition-frame-kind="segment" x="30" y="325" width="860" height="155" rx="8" class="c-lane" stroke-width="1"/>
        <g><rect x="42" y="306" width="245" height="18" rx="3" class="c-mask"/><text x="48" y="319" class="t-dim" font-size="13" font-weight="600">Phase 2: FOR UPDATE SKIP LOCKED Dispatch</text></g>

        <rect data-graph-role="structural-frame" data-composition-frame-kind="segment" x="30" y="505" width="860" height="195" rx="8" class="c-lane" stroke-width="1"/>
        <g><rect x="42" y="486" width="245" height="18" rx="3" class="c-mask"/><text x="48" y="499" class="t-dim" font-size="13" font-weight="600">Phase 3: Parsing, Vectorization &amp; Indexing</text></g>

        <!-- Lifelines -->
        <path d="M 70 125 L 70 690" class="a-default" stroke-width="0.8" stroke-dasharray="3,7"/>
        <path d="M 200 125 L 200 690" class="a-default" stroke-width="0.8" stroke-dasharray="3,7"/>
        <path d="M 330 125 L 330 690" class="a-default" stroke-width="0.8" stroke-dasharray="3,7"/>
        <path d="M 460 125 L 460 690" class="a-default" stroke-width="0.8" stroke-dasharray="3,7"/>
        <path d="M 590 125 L 590 690" class="a-default" stroke-width="0.8" stroke-dasharray="3,7"/>
        <path d="M 720 125 L 720 690" class="a-default" stroke-width="0.8" stroke-dasharray="3,7"/>
        <path d="M 850 125 L 850 690" class="a-default" stroke-width="0.8" stroke-dasharray="3,7"/>

        <!-- Activation Bars -->
        <rect class="activation-bar c-mask" data-participant="api" x="195" y="174" width="10" height="118" rx="3"/>
        <rect class="activation-bar c-backend" data-participant="api" x="195" y="174" width="10" height="118" rx="3" stroke-width="1"/>

        <rect class="activation-bar c-mask" data-participant="postgres" x="325" y="214" width="10" height="46" rx="3"/>
        <rect class="activation-bar c-database" data-participant="postgres" x="325" y="214" width="10" height="46" rx="3" stroke-width="1"/>

        <rect class="activation-bar c-mask" data-participant="dispatcher" x="455" y="344" width="10" height="118" rx="3"/>
        <rect class="activation-bar c-backend" data-participant="dispatcher" x="455" y="344" width="10" height="118" rx="3" stroke-width="1"/>

        <rect class="activation-bar c-mask" data-participant="worker" x="715" y="504" width="10" height="175" rx="3"/>
        <rect class="activation-bar c-backend" data-participant="worker" x="715" y="504" width="10" height="175" rx="3" stroke-width="1"/>

        <rect class="activation-bar c-mask" data-participant="fastembed" x="845" y="550" width="10" height="46" rx="3"/>
        <rect class="activation-bar c-backend" data-participant="fastembed" x="845" y="550" width="10" height="46" rx="3" stroke-width="1"/>

        <!-- Messages -->
        <!-- m1: client -> api -->
        <g data-edge-id="m1" data-edge-from="client" data-edge-to="api">
          <path d="M 75 178 L 195 178" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
          <rect x="85" y="160" width="105" height="15" rx="3" class="c-mask"/>
          <text x="135" y="171" class="t-backend" font-size="12" text-anchor="middle">POST /upload</text>
        </g>

        <!-- m2: api -> postgres -->
        <g data-edge-id="m2" data-edge-from="api" data-edge-to="postgres">
          <path d="M 205 218 L 325 218" class="a-security" stroke-width="1.5" marker-end="url(#arrowhead-security)"/>
          <rect x="215" y="200" width="105" height="15" rx="3" class="c-mask"/>
          <text x="265" y="211" class="t-security" font-size="12" text-anchor="middle">BEGIN: ACID outbox</text>
        </g>

        <!-- m3: postgres -> api -->
        <g data-edge-id="m3" data-edge-from="postgres" data-edge-to="api">
          <path d="M 325 255 L 205 255" class="a-return" stroke-width="1.4" marker-end="url(#arrowhead)"/>
          <rect x="220" y="238" width="90" height="15" rx="3" class="c-mask"/>
          <text x="265" y="249" class="t-muted" font-size="12" text-anchor="middle">COMMIT {job_id}</text>
        </g>

        <!-- m4: api -> client -->
        <g data-edge-id="m4" data-edge-from="api" data-edge-to="client">
          <path d="M 195 290 L 75 290" class="a-return" stroke-width="1.4" marker-end="url(#arrowhead)"/>
          <rect x="85" y="273" width="105" height="15" rx="3" class="c-mask"/>
          <text x="135" y="284" class="t-muted" font-size="12" text-anchor="middle">202 Accepted</text>
        </g>

        <!-- m5: dispatcher -> postgres -->
        <g data-edge-id="m5" data-edge-from="dispatcher" data-edge-to="postgres">
          <path d="M 455 350 L 335 350" class="a-default" stroke-width="1.5" marker-end="url(#arrowhead)"/>
          <rect x="345" y="333" width="100" height="15" rx="3" class="c-mask"/>
          <text x="395" y="344" class="t-muted" font-size="12" text-anchor="middle">SKIP LOCKED poll</text>
        </g>

        <!-- m6: postgres -> dispatcher -->
        <g data-edge-id="m6" data-edge-from="postgres" data-edge-to="dispatcher">
          <path d="M 335 385 L 455 385" class="a-return" stroke-width="1.4" marker-end="url(#arrowhead)"/>
          <rect x="350" y="368" width="90" height="15" rx="3" class="c-mask"/>
          <text x="395" y="379" class="t-muted" font-size="12" text-anchor="middle">yield batch rows</text>
        </g>

        <!-- m7: dispatcher -> redis -->
        <g data-edge-id="m7" data-edge-from="dispatcher" data-edge-to="redis">
          <path d="M 465 420 L 585 420" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
          <rect x="480" y="403" width="95" height="15" rx="3" class="c-mask"/>
          <text x="525" y="414" class="t-backend" font-size="12" text-anchor="middle">enqueue task</text>
        </g>

        <!-- m8: dispatcher -> postgres -->
        <g data-edge-id="m8" data-edge-from="dispatcher" data-edge-to="postgres">
          <path d="M 455 455 L 335 455" class="a-dashed" stroke-width="1.4" marker-end="url(#arrowhead-dashed)"/>
          <rect x="340" y="438" width="110" height="15" rx="3" class="c-mask"/>
          <text x="395" y="449" class="t-messagebus" font-size="12" text-anchor="middle">set dispatched_at</text>
        </g>

        <!-- m9: redis -> worker -->
        <g data-edge-id="m9" data-edge-from="redis" data-edge-to="worker">
          <path d="M 595 510 L 715 510" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
          <rect x="610" y="493" width="95" height="15" rx="3" class="c-mask"/>
          <text x="655" y="504" class="t-backend" font-size="12" text-anchor="middle">consume task</text>
        </g>

        <!-- m10: worker -> fastembed -->
        <g data-edge-id="m10" data-edge-from="worker" data-edge-to="fastembed">
          <path d="M 725 555 L 845 555" class="a-default" stroke-width="1.5" marker-end="url(#arrowhead)"/>
          <rect x="740" y="538" width="95" height="15" rx="3" class="c-mask"/>
          <text x="785" y="549" class="t-muted" font-size="12" text-anchor="middle">pass chunks (500t)</text>
        </g>

        <!-- m11: fastembed -> worker -->
        <g data-edge-id="m11" data-edge-from="fastembed" data-edge-to="worker">
          <path d="M 845 590 L 725 590" class="a-return" stroke-width="1.4" marker-end="url(#arrowhead)"/>
          <rect x="745" y="573" width="85" height="15" rx="3" class="c-mask"/>
          <text x="785" y="584" class="t-muted" font-size="12" text-anchor="middle">return 384d vectors</text>
        </g>

        <!-- m12: worker -> postgres -->
        <g data-edge-id="m12" data-edge-from="worker" data-edge-to="postgres">
          <path d="M 715 630 L 335 630" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
          <rect x="470" y="613" width="115" height="15" rx="3" class="c-mask"/>
          <text x="525" y="624" class="t-backend" font-size="12" text-anchor="middle">insert chunks (HNSW+GIN)</text>
        </g>

        <!-- m13: worker -> postgres -->
        <g data-edge-id="m13" data-edge-from="worker" data-edge-to="postgres">
          <path d="M 715 665 L 335 665" class="a-security" stroke-width="1.5" marker-end="url(#arrowhead-security)"/>
          <rect x="465" y="648" width="125" height="15" rx="3" class="c-mask"/>
          <text x="525" y="659" class="t-security" font-size="12" text-anchor="middle">status = 'active'</text>
        </g>

        <!-- Participants -->
        <g data-node-id="client">
          <rect x="25" y="65" width="90" height="54" rx="6" class="c-mask"/>
          <rect x="25" y="65" width="90" height="54" rx="6" class="c-external" stroke-width="1.5"/>
          <text x="70" y="87" class="t-primary" font-size="13" font-weight="600" text-anchor="middle">Client</text>
          <text x="70" y="103" class="t-muted" font-size="12.5" text-anchor="middle">Browser / SDK</text>
        </g>

        <g data-node-id="api">
          <rect x="155" y="65" width="90" height="54" rx="6" class="c-mask"/>
          <rect x="155" y="65" width="90" height="54" rx="6" class="c-backend" stroke-width="1.5"/>
          <text x="200" y="87" class="t-primary" font-size="13" font-weight="600" text-anchor="middle">FastAPI</text>
          <text x="200" y="103" class="t-muted" font-size="12.5" text-anchor="middle">Upload Endpoint</text>
        </g>

        <g data-node-id="postgres">
          <rect x="285" y="65" width="90" height="54" rx="6" class="c-mask"/>
          <rect x="285" y="65" width="90" height="54" rx="6" class="c-database" stroke-width="1.5"/>
          <text x="330" y="87" class="t-primary" font-size="13" font-weight="600" text-anchor="middle">PostgreSQL</text>
          <text x="330" y="103" class="t-muted" font-size="12.5" text-anchor="middle">Outbox &amp; Store</text>
        </g>

        <g data-node-id="dispatcher">
          <rect x="415" y="65" width="90" height="54" rx="6" class="c-mask"/>
          <rect x="415" y="65" width="90" height="54" rx="6" class="c-backend" stroke-width="1.5"/>
          <text x="460" y="87" class="t-primary" font-size="13" font-weight="600" text-anchor="middle">Dispatcher</text>
          <text x="460" y="103" class="t-muted" font-size="12.5" text-anchor="middle">SKIP LOCKED</text>
        </g>

        <g data-node-id="redis">
          <rect x="545" y="65" width="90" height="54" rx="6" class="c-mask"/>
          <rect x="545" y="65" width="90" height="54" rx="6" class="c-messagebus" stroke-width="1.5"/>
          <text x="590" y="87" class="t-primary" font-size="13" font-weight="600" text-anchor="middle">Redis 8</text>
          <text x="590" y="103" class="t-muted" font-size="12.5" text-anchor="middle">Dramatiq Queue</text>
        </g>

        <g data-node-id="worker">
          <rect x="675" y="65" width="90" height="54" rx="6" class="c-mask"/>
          <rect x="675" y="65" width="90" height="54" rx="6" class="c-backend" stroke-width="1.5"/>
          <text x="720" y="87" class="t-primary" font-size="13" font-weight="600" text-anchor="middle">Worker Pool</text>
          <text x="720" y="103" class="t-muted" font-size="12.5" text-anchor="middle">Chunk Parser</text>
        </g>

        <g data-node-id="fastembed">
          <rect x="805" y="65" width="90" height="54" rx="6" class="c-mask"/>
          <rect x="805" y="65" width="90" height="54" rx="6" class="c-backend" stroke-width="1.5"/>
          <text x="850" y="87" class="t-primary" font-size="13" font-weight="600" text-anchor="middle">FastEmbed</text>
          <text x="850" y="103" class="t-muted" font-size="12.5" text-anchor="middle">Local ONNX 384d</text>
        </g>
      </svg>